<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · Task Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="app-body">
  <div class="app-layout">
    
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-icon">✓</span> TaskTracker
      </div>
      
      <nav class="sidebar-nav">
        <button class="nav-item is-active" id="btn-view-list">☰ List View</button>
        <button class="nav-item" id="btn-view-board">☷ Board View</button>
      </nav>

      <div class="sidebar-stats" id="summary">
        <h4>Overview</h4>
        <div class="stat-row">
          <span>Total Tasks</span>
          <strong id="stat-total">0</strong>
        </div>
        <div class="stat-row">
          <span>Planned</span>
          <strong id="stat-planned">0</strong>
        </div>
        <div class="stat-row">
          <span>In Progress</span>
          <strong id="stat-progress">0</strong>
        </div>
        <div class="stat-row">
          <span>Complete</span>
          <strong id="stat-complete">0</strong>
        </div>
        <div class="progress-bar-wrap">
          <div class="progress-bar" id="progress-fill"></div>
        </div>
      </div>

      <div class="sidebar-user">
        <div class="user-avatar bg-blue">{{ user['name'][0]|upper }}</div>
        <div class="user-info">
          <strong>{{ user['name'] }}</strong>
          <span>{{ user['email'] }}</span>
        </div>
        <form method="post" action="{{ url_for('logout') }}" style="margin:0;">
          <button type="submit" class="btn-logout" title="Sign out">Sign out</button>
        </form>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <header class="topbar">
        <div class="page-title">
          <h1>My Tasks</h1>
          <p>Manage and organize your daily work.</p>
        </div>
        <div class="topbar-actions">
          <a href="{{ url_for('export_tasks') }}" class="btn btn-secondary btn-sm">⬇ Export CSV</a>
        </div>
      </header>

      <section class="content-area">
        <!-- Add Task Form -->
        <div class="panel add-panel">
          <form id="task-form">
            <div class="field-row">
              <div class="field" style="flex: 2;">
                <input id="title" type="text" required placeholder="What needs to be done?">
              </div>
              <div class="field" style="flex: 1;">
                <select id="priority">
                  <option value="Low">Low Priority</option>
                  <option value="Medium" selected>Medium Priority</option>
                  <option value="High">High Priority</option>
                </select>
              </div>
              <div class="field" style="flex: 1;">
                <input id="due-date" type="date">
              </div>
            </div>
            <div class="field">
              <textarea id="description" rows="1" placeholder="Add description (optional)..."></textarea>
            </div>
            <div class="form-actions">
              <p id="form-error" class="error-text" hidden></p>
              <button type="submit" class="btn btn-primary" id="add-btn">+ Add Task</button>
            </div>
          </form>
        </div>

        <!-- Search & Filter -->
        <div class="toolbar">
          <div class="filters" id="filters"></div>
          <div class="search-box">
            <input id="search" type="search" placeholder="Search tasks...">
          </div>
        </div>

        <p id="list-message" class="status-message"></p>

        <!-- List View -->
        <ul id="task-list" class="task-list"></ul>

        <!-- Kanban Board View -->
        <div id="task-board" class="task-board">
          <div class="board-column">
            <div class="board-header">Planned</div>
            <div class="board-body" id="col-planned" data-status="Planned"></div>
          </div>
          <div class="board-column">
            <div class="board-header">In Progress</div>
            <div class="board-body" id="col-in-progress" data-status="In Progress"></div>
          </div>
          <div class="board-column">
            <div class="board-header">Complete</div>
            <div class="board-body" id="col-complete" data-status="Complete"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="toasts" class="toasts"></div>

  <script id="app-config" type="application/json">
    { "statuses": {{ statuses|tojson }}, "priorities": {{ priorities|tojson }} }
  </script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
